<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 110" width="460" height="110">
  <defs>
    <linearGradient id="logoBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d0061" />
      <stop offset="100%" stop-color="#67059c" />
    </linearGradient>
    <linearGradient id="logoOrangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7b00" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Left Icon Emblem (Squircle) -->
  <g transform="translate(10, 10)">
    <rect width="90" height="90" rx="22" fill="url(#logoBgGrad)" filter="url(#logoShadow)" />
    <rect x="2" y="2" width="86" height="86" rx="20" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />
    
    <!-- Stylized Monogram S and G inside emblem -->
    <g transform="translate(15, 12)">
      <!-- S -->
      <path d="M 24 10 L 8 10 C 4 10 0 14 0 18 L 0 26 C 0 30 4 34 8 34 L 20 34 C 24 34 28 38 28 42 L 28 50 C 28 54 24 58 20 58 L 4 58 C 1 58 0 56 0 53" 
            fill="none" 
            stroke="#ffffff" 
            stroke-width="7" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
      <!-- G -->
      <path d="M 58 18 C 56 12 50 10 44 10 L 38 10 C 31 10 26 15 26 23 L 26 45 C 26 53 31 58 39 58 L 51 58 C 57 58 60 54 60 48 L 60 38 L 42 38" 
            fill="none" 
            stroke="url(#logoOrangeGrad)" 
            stroke-width="7" 
            stroke-linecap="round" 
            stroke-linejoin="round" />
    </g>
  </g>

  <!-- Right Typography Section -->
  <g transform="translate(118, 16)">
    <!-- Primary Brand Title -->
    <text x="0" y="40" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="34" font-weight="900" fill="#3b0764" letter-spacing="1">
      SHIVANI
    </text>
    
    <!-- Secondary Brand Subtitle -->
    <text x="0" y="68" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="900" fill="#ea580c" letter-spacing="4">
      GRAPHICS
    </text>
    
    <!-- Tagline & Capabilities -->
    <text x="2" y="88" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-size="9.5" font-weight="700" fill="#64748b" letter-spacing="2">
      PRINT · DESIGN · QUALITY · DELIVER
    </text>

    <!-- Accent Dot -->
    <circle cx="218" cy="62" r="3.5" fill="#f59e0b" />
  </g>
</svg>
