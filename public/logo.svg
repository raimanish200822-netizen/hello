<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#340057" />
      <stop offset="50%" stop-color="#450a6e" />
      <stop offset="100%" stop-color="#550085" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Deep Violet/Purple Canvas -->
  <rect width="512" height="512" rx="100" fill="url(#bgViolet)" />

  <g transform="translate(46, 50)" filter="url(#shadow)">
    <!-- 'S' Path (White Bold Geometric) -->
    <path d="M 220 50 L 90 50 C 50 50 20 80 20 120 L 20 125 C 20 165 50 195 90 195 L 210 195 C 230 195 240 205 240 220 L 240 225 C 240 240 230 250 210 250 L 50 250 C 30 250 20 240 20 225 L 20 205 L 70 205 L 70 215 C 70 220 75 225 85 225 L 200 225 C 210 225 215 220 215 215 L 215 210 C 215 205 210 200 200 200 L 80 200 C 40 200 10 170 10 130 L 10 120 C 10 80 40 50 80 50 Z" 
          fill="#ffffff" />

    <!-- 'G' Path (Vibrant Orange Interlocking Ribbon) -->
    <path d="M 390 125 C 390 75 350 45 280 45 L 220 45 L 180 140 L 240 140 C 270 140 310 150 310 185 L 310 230 C 310 245 300 255 280 255 L 120 255 L 80 300 L 290 300 C 360 300 395 260 395 215 L 395 180 L 285 180 L 285 215 L 335 215 L 335 185 C 335 160 305 155 280 155 L 195 155 L 230 75 L 290 75 C 330 75 345 95 345 125 Z" 
          fill="#ff6f00" />
          
    <!-- White bar completing the G -->
    <rect x="295" y="145" width="85" height="42" rx="4" fill="#ffffff" />
  </g>

  <!-- Typography: SHIVANI (White with Orange 'A') -->
  <g text-anchor="middle" font-family="'Plus Jakarta Sans', -apple-system, sans-serif">
    <text x="256" y="380" font-size="56" font-weight="900" fill="#ffffff" letter-spacing="3">
      SHIVANI
    </text>

    <!-- Typography: GRAPHICS (Bold Orange Tracked) -->
    <text x="256" y="426" font-size="28" font-weight="900" fill="#ff7900" letter-spacing="8">
      GRAPHICS
    </text>

    <!-- Tagline: PRINT · DESIGN · QUALITY with underline rules -->
    <g transform="translate(0, 455)">
      <!-- Left Green Rule -->
      <line x1="50" y1="0" x2="115" y2="0" stroke="#00c853" stroke-width="4.5" stroke-linecap="round" />
      
      <!-- Tagline Text -->
      <text x="256" y="5" font-size="14.5" font-weight="800" fill="#ffffff" letter-spacing="3.5">
        PRINT · DESIGN · QUALITY
      </text>

      <!-- Right Cyan Rule -->
      <line x1="397" y1="0" x2="462" y2="0" stroke="#00e5ff" stroke-width="4.5" stroke-linecap="round" />
    </g>
  </g>
</svg>