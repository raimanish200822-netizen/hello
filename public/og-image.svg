<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="ogBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a0045" />
      <stop offset="45%" stop-color="#4c0075" />
      <stop offset="100%" stop-color="#7e17b8" />
    </linearGradient>
    <linearGradient id="ogOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6b00" />
      <stop offset="100%" stop-color="#ffa000" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="ogShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Deep Purple Background Canvas -->
  <rect width="1200" height="630" fill="url(#ogBg)" />

  <!-- Ambient Decorative Lighting Elements -->
  <circle cx="1100" cy="120" r="320" fill="rgba(255, 107, 0, 0.15)" />
  <circle cx="150" cy="550" r="260" fill="rgba(126, 23, 184, 0.35)" />
  <rect x="0" y="618" width="1200" height="12" fill="url(#ogOrange)" />

  <!-- Top Badge: Delhi NCR Premier Press -->
  <g transform="translate(80, 60)">
    <rect width="360" height="42" rx="21" fill="rgba(255, 255, 255, 0.12)" stroke="rgba(255, 255, 255, 0.25)" stroke-width="1.5" />
    <circle cx="24" cy="21" r="6" fill="#22c55e" />
    <text x="40" y="27" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="15" font-weight="800" fill="#ffffff" letter-spacing="1">
      DELHI NCR COMMERCIAL PRINTING
    </text>
  </g>

  <!-- Left: Brand Emblem & Main Identity -->
  <g transform="translate(80, 130)">
    <!-- Icon Box -->
    <g transform="translate(0, 0)">
      <rect width="150" height="150" rx="36" fill="#ffffff" filter="url(#ogShadow)" />
      
      <!-- SG inside square -->
      <g transform="translate(24, 20)">
        <!-- S in deep purple -->
        <path d="M 40 16 L 14 16 C 6 16 0 22 0 30 L 0 44 C 0 52 6 58 14 58 L 34 58 C 42 58 48 64 48 72 L 48 86 C 48 94 42 100 34 100 L 8 100 C 2 100 0 96 0 90" 
              fill="none" 
              stroke="#50007c" 
              stroke-width="12" 
              stroke-linecap="round" 
              stroke-linejoin="round" />
        <!-- G in vibrant orange -->
        <path d="M 100 30 C 96 20 86 16 76 16 L 66 16 C 54 16 45 25 45 38 L 45 78 C 45 91 54 100 68 100 L 88 100 C 98 100 104 94 104 84 L 104 66 L 72 66" 
              fill="none" 
              stroke="url(#ogOrange)" 
              stroke-width="12" 
              stroke-linecap="round" 
              stroke-linejoin="round" />
      </g>
    </g>

    <!-- Main Title Typography -->
    <g transform="translate(185, 45)">
      <text x="0" y="42" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="2">
        SHIVANI GRAPHICS
      </text>
      <text x="0" y="85" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#ffa000" letter-spacing="6">
        HIGH DEFINITION COMMERCIAL PRINTING
      </text>
    </g>
  </g>

  <!-- Middle Feature Bullets / Offerings Pills -->
  <g transform="translate(80, 325)">
    <!-- Pill 1: Visiting Cards -->
    <g transform="translate(0, 0)">
      <rect width="240" height="52" rx="16" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
      <text x="24" y="33" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff">
        ⚡ 5-Min Visiting Cards
      </text>
    </g>

    <!-- Pill 2: Flex Banners -->
    <g transform="translate(260, 0)">
      <rect width="250" height="52" rx="16" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
      <text x="24" y="33" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff">
        🌟 Star Flex Banners
      </text>
    </g>

    <!-- Pill 3: Standees & Signage -->
    <g transform="translate(530, 0)">
      <rect width="250" height="52" rx="16" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
      <text x="24" y="33" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff">
        🪧 Roll-up Standees
      </text>
    </g>

    <!-- Pill 4: Corporate Merch -->
    <g transform="translate(800, 0)">
      <rect width="240" height="52" rx="16" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />
      <text x="24" y="33" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="18" font-weight="800" fill="#ffffff">
        🎁 Corporate Merch
      </text>
    </g>
  </g>

  <!-- Tagline Banner -->
  <g transform="translate(80, 415)">
    <text x="0" y="35" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="28" font-weight="800" fill="#f8fafc">
      Direct Factory Rates · Same-Day Counter Pickup · Pan-India Dispatch
    </text>
  </g>

  <!-- Bottom Details Bar -->
  <g transform="translate(80, 490)">
    <rect width="1040" height="88" rx="22" fill="rgba(0, 0, 0, 0.35)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5" />
    
    <!-- Location -->
    <g transform="translate(30, 26)">
      <text x="0" y="20" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="14" font-weight="800" fill="#ffa000">
        📍 STORE LOCATION:
      </text>
      <text x="0" y="42" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="16" font-weight="700" fill="#ffffff">
        D3/50, Gali No. 8A, Mahavir Enclave, New Delhi 110045
      </text>
    </g>

    <!-- WhatsApp Contact Direct -->
    <g transform="translate(710, 24)">
      <rect width="295" height="42" rx="21" fill="#25D366" />
      <text x="28" y="27" font-family="'Plus Jakarta Sans', -apple-system, sans-serif" font-size="17" font-weight="900" fill="#ffffff">
        💬 WhatsApp: 9266944315
      </text>
    </g>
  </g>
</svg>
